aid: camfer
name: Camfer
description: Camfer is a Y Combinator-backed startup (S24) building an AI mechanical
  engineer — an AI-powered CAD tool that plugs into SolidWorks and lets engineers generate
  parametric designs from natural language prompts and images. Its camfy text-to-CAD
  model produces editable feature-tree geometry, automates repetitive modeling tasks,
  answers questions about a model without manual feature-tree navigation, and gives
  real-time design feedback. The product is a downloadable desktop application (currently
  in invite-only beta), not a public API; the company is backed by Y Combinator, Next47,
  Bloomberg Beta, Octave Fund, and the founders of Dropbox, Airtable, and Clari.
